<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SendSent · 我的</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#0a0b0e] flex flex-wrap items-center justify-center gap-16 p-10">

  <div class="relative" style="width:393px;height:852px">
    <div class="absolute inset-0 rounded-[3.4rem] bg-black"
         style="box-shadow:0 50px 100px rgba(0,0,0,.7),0 0 0 11px #16171c,0 0 0 12.5px #33353d"></div>

    <div class="absolute inset-[12px] rounded-[2.6rem] overflow-hidden bg-[#08090f]">

      <!-- 环境光 -->
      <div class="absolute inset-0" style="background:radial-gradient(760px 560px at 50% 34%, rgba(99,102,241,.17), transparent 62%)"></div>
      <div class="absolute inset-0 opacity-[.03]"
           style="background-image:linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);background-size:44px 44px"></div>

      <div class="absolute left-1/2 -translate-x-1/2 top-[11px] z-30 w-[126px] h-[37px] rounded-full bg-black"></div>

      <!-- 状态栏 -->
      <div class="relative z-20 flex items-center justify-between px-8 pt-[18px]">
        <span class="text-[16px] font-semibold text-white tracking-tight">21:10</span>
        <div class="flex items-center gap-1.5 text-white">
          <i data-lucide="wifi" class="w-[18px] h-[18px]"></i>
          <div class="flex items-center gap-0.5">
            <div class="w-[22px] h-[11px] rounded-[3px] border border-white/50 p-[1.5px]"><div class="h-full w-[78%] rounded-[1px] bg-white"></div></div>
            <div class="w-[1.5px] h-[4px] rounded-r bg-white/50"></div>
          </div>
        </div>
      </div>

      <!-- 名字 -->
      <div class="relative z-10 px-6 pt-8">
        <h1 class="text-[14px] font-medium text-white/40 tracking-tight">我的</h1>
        <div class="mt-2 flex items-end justify-between">
          <div class="text-[32px] leading-none font-semibold text-white" style="letter-spacing:-.03em">iPhone</div>
          <button class="mb-0.5 w-9 h-9 rounded-full flex items-center justify-center shrink-0" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09)">
            <i data-lucide="pencil" class="w-[15px] h-[15px] text-white/80"></i>
          </button>
        </div>
        <div class="mt-3 flex items-center gap-2 text-[13px] text-white/40 tracking-tight">
          <span class="w-[6px] h-[6px] rounded-full bg-[#34d399]"></span>
          <span>可被发现</span>
          <span class="text-white/20">·</span>
          <span>iOS</span>
          <span class="text-white/20">·</span>
          <span>端口 52,225</span>
        </div>
      </div>

      <!-- 二维码(海报) -->
      <div class="relative z-10 mt-7 flex flex-col items-center">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[320px] h-[320px] rounded-full"
             style="background:radial-gradient(circle, rgba(99,102,241,.32), transparent 66%)"></div>
        <div class="relative p-4 rounded-[30px]" style="background:#fff;box-shadow:0 26px 60px rgba(0,0,0,.5)">
          <div id="qr" class="relative w-[184px] h-[184px]"></div>
        </div>
        <p class="relative mt-4 text-[12px] text-white/40 tracking-tight">让对方在 SendSent 里扫码连接</p>
      </div>

      <!-- 信息 -->
      <div class="relative z-10 mt-7 px-6">
        <div class="text-[12px] font-semibold text-white/35 tracking-tight">本机地址</div>
        <div class="mt-1.5 flex items-center justify-between py-2.5" style="border-top:1px solid rgba(255,255,255,.07)">
          <span class="text-[14px] text-white/90 tracking-tight" style="font-family:ui-monospace,Menlo,monospace">192.168.1.3:52225</span>
          <span class="text-[12px] text-white/30">en0</span>
        </div>
        <div class="flex items-center justify-between py-2.5" style="border-top:1px solid rgba(255,255,255,.07)">
          <span class="text-[14px] text-white/90 tracking-tight" style="font-family:ui-monospace,Menlo,monospace">10.22.230.99:52225</span>
          <span class="text-[12px] text-white/30">pdp_ip0</span>
        </div>

        <div class="text-[12px] font-semibold text-white/35 tracking-tight mt-6">关于</div>
        <div class="mt-1.5 flex items-center justify-between py-2.5" style="border-top:1px solid rgba(255,255,255,.07)">
          <span class="text-[14px] text-white/70 tracking-tight">设备 ID</span>
          <span class="text-[12px] text-white/40 tracking-tight" style="font-family:ui-monospace,Menlo,monospace">9F3A·C21B·7D04·E8A6</span>
        </div>
        <div class="flex items-center justify-between py-2.5" style="border-top:1px solid rgba(255,255,255,.07)">
          <span class="text-[14px] text-white/70 tracking-tight">版本</span>
          <span class="text-[13px] text-white/40 tracking-tight">0.1.0</span>
        </div>
      </div>

      <!-- Tab bar -->
      <div class="absolute left-0 right-0 bottom-0 z-20 h-[104px] pt-2.5"
           style="background:linear-gradient(180deg,rgba(8,9,15,.35),rgba(8,9,15,.92) 42%);backdrop-filter:blur(26px);border-top:1px solid rgba(255,255,255,.06)">
        <div class="flex items-start justify-around px-6">
          <div class="flex flex-col items-center gap-1 w-[64px]"><i data-lucide="radar" class="w-[23px] h-[23px] text-white/45"></i><span class="text-[10px] font-medium text-white/45">附近</span></div>
          <div class="flex flex-col items-center gap-1 w-[64px]"><i data-lucide="arrow-left-right" class="w-[23px] h-[23px] text-white/45"></i><span class="text-[10px] font-medium text-white/45">传输</span></div>
          <div class="flex flex-col items-center gap-1 w-[64px]"><i data-lucide="circle-user-round" class="w-[23px] h-[23px] text-[#8b8dff]"></i><span class="text-[10px] font-semibold text-[#8b8dff]">我的</span></div>
          <div class="flex flex-col items-center gap-1 w-[64px]"><i data-lucide="settings" class="w-[23px] h-[23px] text-white/45"></i><span class="text-[10px] font-medium text-white/45">设置</span></div>
        </div>
        <div class="mx-auto mt-2 w-[134px] h-[5px] rounded-full bg-white/85"></div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
    (function () {
      var n = 25, el = document.getElementById('qr'), seed = 987654321;
      function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
      function finderVal(x, y) {
        function block(ox, oy) {
          var dx = x - ox, dy = y - oy;
          if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
          var r = Math.max(Math.abs(dx - 3), Math.abs(dy - 3));
          return (r === 3 || r <= 1) ? 1 : 0;
        }
        if (x < 7 && y < 7) return block(0, 0);
        if (x >= n - 7 && y < 7) return block(n - 7, 0);
        if (x < 7 && y >= n - 7) return block(0, n - 7);
        return null;
      }
      function inFinder(x, y) { return (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8); }
      function alignVal(x, y) {
        var ox = n - 9, oy = n - 9, dx = x - ox, dy = y - oy;
        if (dx < 0 || dy < 0 || dx > 4 || dy > 4) return null;
        var r = Math.max(Math.abs(dx - 2), Math.abs(dy - 2));
        return (r === 2 || r === 0) ? 1 : 0;
      }
      var out = '';
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) {
        var on, fv = finderVal(x, y);
        if (fv !== null) on = fv;
        else if (inFinder(x, y)) on = 0;
        else if (x === 6 || y === 6) on = ((x + y) % 2 === 0) ? 1 : 0;
        else { var av = alignVal(x, y); on = (av !== null) ? av : (rnd() > 0.5 ? 1 : 0); }
        if (on) out += '<i style="position:absolute;left:' + (x * 100 / n) + '%;top:' + (y * 100 / n) +
          '%;width:' + (100 / n) + '%;height:' + (100 / n) + '%;background:#0b0b0f;border-radius:1.5px"></i>';
      }
      el.innerHTML = out;
    })();
  </script>
</body>
</html>
