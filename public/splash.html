<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SendSent</title>
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <div class="bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>

    <main class="stage">
      <div class="logo-wrap">
        <div class="logo-glow"></div>
        <div class="logo-ring r1"></div>
        <div class="logo-ring r2"></div>
        <svg class="logo" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="SendSent">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7B5CFF"/>
              <stop offset="0.5" stop-color="#4FB6FF"/>
              <stop offset="1" stop-color="#34D4A1"/>
            </linearGradient>
          </defs>
          <path
            d="M14 48c0-18.7 15.3-34 34-34 11 0 20.5 5.2 26.7 13.3l-9.3 7c-3.9-5-10-8.3-17.4-8.3-12.2 0-22 9.8-22 22s9.8 22 22 22c7.4 0 13.5-3.3 17.4-8.3l9.3 7C68.5 76.8 59 82 48 82c-18.7 0-34-15.3-34-34Z"
            fill="url(#lg)"
          />
          <circle cx="48" cy="48" r="7" fill="url(#lg)"/>
          <path d="M40 64 L56 64 L48 78 Z" fill="url(#lg)" opacity="0.85"/>
        </svg>
      </div>

      <h1 class="brand">SendSent</h1>
      <p class="tagline">附近设备的文件快传</p>

      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </main>

    <footer class="foot">
      <span class="status" id="status">正在准备 mDNS · Bonjour…</span>
    </footer>
  </body>
</html>
