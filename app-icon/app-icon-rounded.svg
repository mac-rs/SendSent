<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SendSent app icon · macOS / Windows variant: Big Sur style rounded square with margin -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121729"/>
      <stop offset="1" stop-color="#0a0c13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#4d8dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3be0ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4d8dff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3be0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3be0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <clipPath id="plate">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#grid)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>

    <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="5">
      <circle cx="512" cy="570" r="250"/>
      <circle cx="512" cy="570" r="380"/>
      <circle cx="512" cy="570" r="510"/>
    </g>

    <path d="M 529.4 471.5 L 600.5 67.7 A 510 510 0 0 1 953.7 315 L 598.6 520 A 100 100 0 0 0 529.4 471.5 Z"
          fill="url(#sweep)"/>

    <path d="M256 640 L512 320 L768 640" fill="none" stroke="url(#chev)" stroke-width="96"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 792 H768" stroke="#3be0ff" stroke-width="96" stroke-linecap="round"/>

    <circle cx="823" cy="352" r="84" fill="url(#dotGlow)"/>
    <circle cx="823" cy="352" r="55" fill="none" stroke="#3be0ff" stroke-opacity="0.3" stroke-width="6"/>
    <circle cx="823" cy="352" r="86" fill="none" stroke="#3be0ff" stroke-opacity="0.12" stroke-width="6"/>
    <circle cx="823" cy="352" r="30" fill="#3be0ff"/>
  </g>
</svg>
