  <path d="M353 686 H671" stroke="#3be0ff" stroke-width="60" stroke-linecap="round"/>

  <circle cx="705" cy="413" r="52" fill="url(#dotGlow)"/>
  <circle cx="705" cy="413" r="33" fill="#3be0ff"/>
