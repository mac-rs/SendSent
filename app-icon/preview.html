<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#2a2d33;font:12px -apple-system;color:#ccd;display:flex;gap:40px;padding:40px;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:18px;align-items:center}
.row{display:flex;gap:14px;align-items:flex-end}
img{border-radius:0}
.lbl{margin-top:6px}
.dark{background:#111}
</style></head><body>
<div class="col">
  <img src="/app-icon/app-icon.svg" width="360" height="360" style="border-radius:80px">
  <div class="lbl">full-bleed (iOS)</div>
  <div class="row">
    <img src="/app-icon/app-icon.svg" width="128" height="128" style="border-radius:29px">
    <img src="/app-icon/app-icon.svg" width="64" height="64" style="border-radius:14px">
    <img src="/app-icon/app-icon.svg" width="32" height="32" style="border-radius:7px">
    <img src="/app-icon/app-icon.svg" width="16" height="16" style="border-radius:4px">
  </div>
  <div class="lbl">iOS sizes 128/64/32/16</div>
</div>
<div class="col">
  <img src="/app-icon/app-icon-rounded.svg" width="360" height="360">
  <div class="lbl">rounded (macOS/Windows)</div>
  <div class="row dark" style="padding:10px;border-radius:12px">
    <img src="/app-icon/app-icon-rounded.svg" width="128" height="128">
    <img src="/app-icon/app-icon-rounded.svg" width="64" height="64">
    <img src="/app-icon/app-icon-rounded.svg" width="32" height="32">
  </div>
  <div class="lbl">mac sizes on dark dock</div>
</div>
<div class="col">
  <div style="position:relative;width:300px;height:300px;border-radius:70px;overflow:hidden">
    <img src="/app-icon/android-bg.svg" style="position:absolute;inset:0;width:300px;height:300px">
    <img src="/app-icon/android-fg.svg" style="position:absolute;inset:0;width:300px;height:300px">
  </div>
  <div class="lbl">android adaptive (circle-ish)</div>
  <div class="row">
    <div style="position:relative;width:96px;height:96px;border-radius:50%;overflow:hidden">
      <img src="/app-icon/android-bg.svg" style="position:absolute;inset:0;width:96px;height:96px">
      <img src="/app-icon/android-fg.svg" style="position:absolute;inset:0;width:96px;height:96px">
    </div>
    <div style="position:relative;width:48px;height:48px;border-radius:50%;overflow:hidden">
      <img src="/app-icon/android-bg.svg" style="position:absolute;inset:0;width:48px;height:48px">
      <img src="/app-icon/android-fg.svg" style="position:absolute;inset:0;width:48px;height:48px">
    </div>
  </div>
  <div class="lbl">android circle 96/48</div>
</div>
</body></html>
